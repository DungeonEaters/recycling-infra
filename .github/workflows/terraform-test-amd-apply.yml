name: Terraform test AMD fallback

on:
  push:
    branches:
      - infra/test-bootstrap

permissions:
  contents: read

concurrency:
  group: terraform-test-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Apply OCI test AMD fallback
    if: contains(github.event.head_commit.message, '[test-amd-apply]')
    runs-on: ubuntu-latest
    environment: terraform-test
    defaults:
      run:
        working-directory: environments/test
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.OCI_STATE_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_STATE_S3_SECRET_KEY }}
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
      TF_VAR_api_key_fingerprint: ${{ secrets.OCI_API_KEY_FINGERPRINT }}
      TF_VAR_api_private_key: ${{ secrets.OCI_API_PRIVATE_KEY }}
      TF_VAR_region: ${{ vars.OCI_REGION }}
      TF_VAR_compartment_ocid: ${{ vars.OCI_TEST_COMPARTMENT_OCID }}
      TF_VAR_availability_domain: ${{ vars.OCI_AVAILABILITY_DOMAIN }}
      TF_VAR_ubuntu_image_ocid: ocid1.image.oc1.sa-santiago-1.aaaaaaaa5lknhekd4kwcvekp5ry46e3awaozmqarcactbmlcpamc54youwha
      TF_VAR_ssh_public_key: ${{ vars.DEPLOY_SSH_PUBLIC_KEY }}
      TF_VAR_admin_cidrs: ${{ vars.ADMIN_CIDRS }}
      TF_VAR_shape: VM.Standard.E2.1.Micro
      TF_VAR_is_flexible_shape: "false"
      OCI_STATE_BUCKET: recycling-tfstate-test
      OCI_STATE_NAMESPACE: ${{ vars.OCI_STATE_NAMESPACE }}
      OCI_REGION: ${{ vars.OCI_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Validate fallback inputs
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$TF_VAR_compartment_ocid"
          test -n "$TF_VAR_availability_domain"
          test -n "$TF_VAR_ssh_public_key"
          test -n "$TF_VAR_admin_cidrs"
          test -n "$OCI_STATE_NAMESPACE"
      - name: Initialize OCI Object Storage state
        run: |
          terraform init \
            -backend-config="bucket=$OCI_STATE_BUCKET" \
            -backend-config="key=application-test/terraform.tfstate" \
            -backend-config="region=$OCI_REGION" \
            -backend-config="endpoint=https://$OCI_STATE_NAMESPACE.compat.objectstorage.$OCI_REGION.oraclecloud.com" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_s3_checksum=true" \
            -backend-config="use_path_style=true"
      - name: Plan AMD fallback apply
        run: terraform plan -out=tfplan
      - name: Apply AMD fallback plan
        run: terraform apply -auto-approve tfplan
      - name: Outputs
        run: terraform output
