name: Bootstrap OCI test

on:
  push:
    branches:
      - infra/test-bootstrap

permissions:
  contents: read

concurrency:
  group: bootstrap-oci-test
  cancel-in-progress: false

jobs:
  validate:
    name: Format and validate bootstrap
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/bootstrap
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  apply:
    name: Apply bootstrap test
    needs: validate
    if: contains(github.event.head_commit.message, '[bootstrap-apply]')
    runs-on: ubuntu-latest
    environment: terraform-test
    defaults:
      run:
        working-directory: environments/bootstrap
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.OCI_STATE_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_STATE_S3_SECRET_KEY }}
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
      TF_VAR_api_key_fingerprint: ${{ secrets.OCI_API_KEY_FINGERPRINT }}
      TF_VAR_api_private_key: ${{ secrets.OCI_API_PRIVATE_KEY }}
      TF_VAR_region: ${{ vars.OCI_REGION }}
      TF_VAR_parent_compartment_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_object_storage_namespace: ${{ vars.OCI_STATE_NAMESPACE }}
      OCI_STATE_NAMESPACE: ${{ vars.OCI_STATE_NAMESPACE }}
      OCI_REGION: ${{ vars.OCI_REGION }}
      OCI_STATE_BUCKET: recycling-tfstate-test
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Validate bootstrap inputs
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$TF_VAR_tenancy_ocid"
          test -n "$TF_VAR_user_ocid"
          test -n "$TF_VAR_api_key_fingerprint"
          test -n "$TF_VAR_api_private_key"
          test -n "$TF_VAR_region"
          test -n "$OCI_STATE_NAMESPACE"
      - name: Initialize local bootstrap state
        run: terraform init
      - name: Apply ephemeral prerequisites
        run: terraform apply -auto-approve
      - name: Configure OCI Object Storage backend
        run: |
          cat > bootstrap-state-backend.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF
      - name: Migrate bootstrap state to OCI Object Storage
        run: |
          for attempt in $(seq 1 12); do
            if terraform init -migrate-state -input=false \
              -backend-config="bucket=$OCI_STATE_BUCKET" \
              -backend-config="key=bootstrap-test/terraform.tfstate" \
              -backend-config="region=$OCI_REGION" \
              -backend-config="endpoint=https://$OCI_STATE_NAMESPACE.compat.objectstorage.$OCI_REGION.oraclecloud.com" \
              -backend-config="skip_credentials_validation=true" \
              -backend-config="skip_region_validation=true" \
              -backend-config="skip_requesting_account_id=true" \
              -backend-config="skip_metadata_api_check=true" \
              -backend-config="use_path_style=true"; then
              exit 0
            fi
            test "$attempt" -lt 12 || exit 1
            sleep 10
          done
      - name: Output created prerequisites
        run: terraform output

  recover-state:
    name: Recover bootstrap test state
    needs: validate
    if: contains(github.event.head_commit.message, '[bootstrap-recover]')
    runs-on: ubuntu-latest
    environment: terraform-test
    defaults:
      run:
        working-directory: environments/bootstrap
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.OCI_STATE_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_STATE_S3_SECRET_KEY }}
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
      TF_VAR_api_key_fingerprint: ${{ secrets.OCI_API_KEY_FINGERPRINT }}
      TF_VAR_api_private_key: ${{ secrets.OCI_API_PRIVATE_KEY }}
      TF_VAR_region: ${{ vars.OCI_REGION }}
      TF_VAR_parent_compartment_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_object_storage_namespace: ${{ vars.OCI_STATE_NAMESPACE }}
      OCI_STATE_BUCKET: recycling-tfstate-test
      OCI_STATE_NAMESPACE: ${{ vars.OCI_STATE_NAMESPACE }}
      OCI_REGION: ${{ vars.OCI_REGION }}
      OCI_TEST_COMPARTMENT_OCID: ${{ vars.OCI_TEST_COMPARTMENT_OCID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Validate recovery inputs
        run: |
          test -n "$OCI_TEST_COMPARTMENT_OCID"
          test -n "$OCI_STATE_NAMESPACE"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
      - name: Initialize local recovery state
        run: terraform init
      - name: Import existing prerequisite resources
        run: |
          terraform import oci_identity_compartment.test "$OCI_TEST_COMPARTMENT_OCID"
          terraform import oci_objectstorage_bucket.state \
            "n/$OCI_STATE_NAMESPACE/b/$OCI_STATE_BUCKET"
      - name: Configure OCI Object Storage backend
        run: |
          cat > bootstrap-state-backend.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF
      - name: Migrate recovered state to OCI Object Storage
        run: |
          terraform init -migrate-state -input=false \
            -backend-config="bucket=$OCI_STATE_BUCKET" \
            -backend-config="key=bootstrap-test/terraform.tfstate" \
            -backend-config="region=$OCI_REGION" \
            -backend-config="endpoint=https://$OCI_STATE_NAMESPACE.compat.objectstorage.$OCI_REGION.oraclecloud.com" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="use_path_style=true"
      - name: Verify recovered state
        run: terraform output
