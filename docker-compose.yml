services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recycling
      POSTGRES_PASSWORD: recycling
      POSTGRES_DB: recycling
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recycling"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ../recycling-backend
    environment:
      DATABASE_URL: postgresql+psycopg://recycling:recycling@db:5432/recycling
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      TZ: America/Santiago
    ports:
      - "8000:8000"
    volumes:
      - ../recycling-backend:/srv
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../recycling-web
      target: development
    environment:
      VITE_API_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ../recycling-web:/app
      - web-node-modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      api:
        condition: service_healthy

  mobile:
    build:
      context: ../recycling-mobile
      target: development
    environment:
      VITE_API_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5174:5174"
    volumes:
      - ../recycling-mobile:/app
      - mobile-node-modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5174"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  web-node-modules:
  mobile-node-modules:
